# ---------------------------------------------------------------------------
# H2, in memory. The assignment asks for H2, and it means the whole project
# runs with no database to install: Hibernate builds the tables at startup and
# data.sql fills them.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:asgdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Browse the data at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:asgdb)
spring.h2.console.enabled=true

# Print every SQL statement Hibernate runs, so you can see what JPA does for you
spring.jpa.show-sql=true

# create-drop: Hibernate creates the tables from the @Entity classes on every
# start and drops them on shutdown. Nothing to install, nothing to clean up.
spring.jpa.hibernate.ddl-auto=create-drop

# Run data.sql AFTER Hibernate has created the tables, not before
spring.jpa.defer-datasource-initialization=true
spring.datasource.initialization-mode=always

# A field maps to a column with exactly the same name:
#   field manufactureDate -> column manufactureDate  (not manufacture_date)
# The column names in data.sql are written to match the field names.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Keep the Hibernate session open while the controller builds the DTO, so the
# lazy one-to-many lists can still be read there
spring.jpa.open-in-view=true
